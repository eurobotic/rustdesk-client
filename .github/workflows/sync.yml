name: Sync upstream

# Todo dia olha a última release do rustdesk/rustdesk; se ainda não tem build com a marca da
# Eurostec, prepara a árvore e empurra a tag X.Y.Z-N. O build em si roda no workflow do upstream
# que vem dentro dessa tag ("Flutter Tag Build"); promote.yml promove a release quando ele termina.
on:
  schedule:
    - cron: "0 9 * * *" # 06:00 em São Paulo
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Tag do upstream (vazio = última release)"
        required: false
        default: ""
      rebuild:
        description: "Gerar tag nova mesmo que a versão já tenha build"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Ferramentas de imagem
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q imagemagick librsvg2-bin python3-yaml
          # Ubuntu ainda empacota o ImageMagick 6; os scripts chamam "magick".
          command -v magick >/dev/null || sudo ln -s "$(command -v convert)" /usr/local/bin/magick

      - name: Preparar e enviar a tag
        env:
          GH_TOKEN: ${{ github.token }}
          RUSTDESK_HOST: ${{ vars.RUSTDESK_HOST }}
          RUSTDESK_KEY: ${{ vars.RUSTDESK_KEY }}
          BRAND_PRODUCT_NAME: ${{ vars.BRAND_PRODUCT_NAME }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
          REBUILD: ${{ inputs.rebuild }}
          CLIENT_REPO: ${{ github.repository }}
          CLIENT_REPO_TOKEN: ${{ secrets.CLIENT_REPO_TOKEN }}
          WORK_DIR: ${{ runner.temp }}/sync
        run: scripts/sync.sh
