name: Promote release

# O flutter-build.yml do upstream publica a release como pré-lançamento. Quando o "Flutter Tag
# Build" de uma tag termina bem e os seis instaladores estão lá, tira o prerelease e marca como
# latest, para o link releases/latest apontar para ela.
on:
  workflow_run:
    workflows: ["Flutter Tag Build"]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Conferir os instaladores e promover
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "não é uma tag de build: $TAG"; exit 0; }
          version="${TAG%-*}"
          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=""
          for want in "rustdesk-$version-x86_64.exe" "rustdesk-$version-x86_64.msi" \
                      "rustdesk-$version-x86_64.deb" "rustdesk-$version-x86_64.AppImage" \
                      "rustdesk-$version-x86_64.dmg" "rustdesk-$version-aarch64.dmg"; do
            grep -qx "$want" <<<"$assets" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "faltam assets:$missing" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest \
            --title "RustDesk $version Eurostec ($TAG)" \
            --notes "Cliente RustDesk $version com a marca da Eurostec e o servidor já configurado. Código fonte: esta tag. Windows: SmartScreen avisa porque o instalador não é assinado; clique em Mais informações › Executar assim mesmo. macOS: botão direito › Abrir na primeira vez."
          echo "release $TAG promovida" >> "$GITHUB_STEP_SUMMARY"
