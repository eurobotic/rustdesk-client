name: Promote release

# O flutter-build.yml do upstream publica a release como pré-lançamento. Quando o "Flutter Tag
# Build" de uma tag termina bem, renomeia os arquivos (rustdesk-X.Y.Z-... vira
# <BRAND_APP_NAME>-X.Y.Z-..., e os dmg não assinados perdem a arquitetura duplicada), confere
# os seis instaladores, tira o prerelease e marca como latest, para o link releases/latest
# apontar para ela.
on:
  workflow_run:
    workflows: ["Flutter Tag Build"]
    types: [completed]

permissions:
  contents: write

jobs:
  promote:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.workflow_run.head_branch }}
      APP: ${{ vars.BRAND_APP_NAME || 'rustdesk' }}
    steps:
      - name: Conferir os instaladores, renomear os dmg e promover
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "não é uma tag de build: $TAG"; exit 0; }
          version="${TAG%-*}"

          # rustdesk-1.5.0-x86_64-x86_64.dmg -> <APP>-1.5.0-x86_64.dmg; rustdesk-1.5.0-x86_64.exe -> <APP>-1.5.0-x86_64.exe
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[] | "\(.id) \(.name)"' |
          while read -r id name; do
            new="$name"
            case "$name" in
              rustdesk-"$version"-*-*.dmg) arch="${name##*-}"; new="rustdesk-$version-${arch}" ;;
            esac
            case "$new" in
              rustdesk-"$version"*) new="$APP-${new#rustdesk-}" ;;
              rustdesk-unattended-*) new="$APP-unattended-${new#rustdesk-unattended-}" ;;
            esac
            if [ "$new" != "$name" ]; then
              echo "renomeando $name -> $new"
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" -f name="$new" >/dev/null
            fi
          done

          assets="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          missing=""
          for want in "$APP-$version-x86_64.exe" "$APP-$version-x86_64.msi" \
                      "$APP-$version-x86_64.deb" "$APP-$version-x86_64.AppImage" \
                      "$APP-$version-x86_64.dmg" "$APP-$version-aarch64.dmg"; do
            grep -qx "$want" <<<"$assets" || missing="$missing $want"
          done
          if [ -n "$missing" ]; then
            echo "faltam assets:$missing" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --prerelease=false --latest \
            --title "$APP $version ($TAG)" \
            --notes "$APP: cliente RustDesk $version com a marca da Eurostec e o servidor já configurado. Código fonte: esta tag. Windows: SmartScreen avisa porque o instalador não é assinado; clique em Mais informações › Executar assim mesmo. macOS: botão direito › Abrir na primeira vez."
          echo "release $TAG promovida" >> "$GITHUB_STEP_SUMMARY"
